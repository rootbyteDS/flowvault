name: Release

# Ein Tag vX.Y.Z auf main erzeugt das GitHub-Release mit dem passenden Abschnitt aus CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: GitHub-Release erstellen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag muss auf main liegen
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Release-Notizen aus CHANGELOG.md lesen
        run: node scripts/changelog.ts release "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Tests
        run: npm test
      - name: TypeScript prüfen
        run: npm run typecheck
      - name: Frontend bauen
        run: npm run build
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "FlowVault $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
