services:
  flowvault:
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:-}
    container_name: flowvault
    restart: unless-stopped
    ports:
      # Nur lokal erreichbar. Von außen über einen Reverse Proxy mit HTTPS (Caddy, Traefik, nginx)
      # freigeben – nicht "4000:4000" eintragen: Docker umgeht dabei auch die Firewall (ufw).
      - "127.0.0.1:4000:4000"
    environment:
      # Langer, zufälliger Wert – verschlüsselt die n8n-API-Keys. NICHT verlieren!
      APP_SECRET: ${APP_SECRET:?Bitte APP_SECRET in .env setzen}
      # Optional: feste Admin-Zugangsdaten. Leer = beim ersten Aufruf festlegen – mit dem
      # Einrichtungscode aus `docker compose logs flowvault`.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Hinter einem Reverse Proxy (Caddy, Traefik, nginx) in der .env TRUST_PROXY=1 setzen – sonst
      # teilen sich alle Nutzer die IP des Proxys und die Login-Sperre trifft alle gleichzeitig.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Optional: externer Deployment-Dienst für den Update-Button in FlowVault.
      UPDATE_WEBHOOK_URL: ${UPDATE_WEBHOOK_URL:-}
      UPDATE_WEBHOOK_TOKEN: ${UPDATE_WEBHOOK_TOKEN:-}
      UPDATE_MANAGEMENT_URL: ${UPDATE_MANAGEMENT_URL:-}
      # Optional: Sprache für Server-Logs und KI-Texte (de oder en). Leer = Deutsch.
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-}
    volumes:
      - flowvault-data:/data

volumes:
  flowvault-data:
