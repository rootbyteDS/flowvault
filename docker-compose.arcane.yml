# In Arcane als neues Projekt einfügen und mit "Build & Deploy" starten.
# In Arcanes .env-Editor APP_SECRET setzen (openssl rand -base64 32).
# Der Build lädt den Quellcode direkt aus dem öffentlichen GitHub-Repository.
services:
  flowvault:
    # Fester lokaler Image-Name für Build und anschließende Redeploys.
    image: flowvault:local
    pull_policy: never
    build:
      context: https://github.com/rootbyteDS/flowvault.git#main
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-}
    container_name: flowvault
    restart: unless-stopped
    ports:
      # Zugriff von außen über einen Reverse Proxy mit HTTPS einrichten.
      - "127.0.0.1:4000:4000"
    environment:
      APP_SECRET: ${APP_SECRET:?Bitte APP_SECRET in Arcane setzen}
      # Optional: festes Passwort. Leer = Einrichtungscode aus den Container-Logs.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Optional: Webhook muss bei diesem Quellcode-Build neu bauen UND deployen.
      # Ein reiner Redeploy-/Container-Update-Webhook baut keinen neuen Quellcode.
      UPDATE_WEBHOOK_URL: ${UPDATE_WEBHOOK_URL:-}
      UPDATE_WEBHOOK_TOKEN: ${UPDATE_WEBHOOK_TOKEN:-}
      UPDATE_MANAGEMENT_URL: ${UPDATE_MANAGEMENT_URL:-}
      # Optional: Sprache für Server-Logs und KI-Texte (de oder en). Leer = Deutsch.
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-}
      # Bei Betrieb hinter einem Reverse Proxy in Arcane TRUST_PROXY=1 setzen.
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - flowvault-data:/data

volumes:
  flowvault-data:
